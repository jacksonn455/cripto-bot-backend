# Render Blueprint for this repo (the dashboard is deployed separately, on Vercel). Secrets are `sync: false`:
# Render asks for them on the first deploy (values in backend/.env.render, git-ignored).
services:
  - type: web
    name: cripto-bot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Binance blocks US IPs (HTTP 451): the market-data feed only works from outside the US.
    region: frankfurt
    # Free instances sleep after 15 min without traffic, which stops the paper loop.
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRADING_MODE
        value: PAPER
      - key: LIVE_TRADING_CONFIRMED
        value: "false"
      - key: EXECUTION_ENABLED
        value: "true"
      - key: MARKET_DATA_BASE_URL
        value: https://api.binance.com
      - key: BINANCE_BASE_URL
        value: https://testnet.binance.vision
      - key: BINANCE_WS_BASE_URL
        value: wss://testnet.binance.vision
      - key: PAPER_INITIAL_BALANCE_ASSET
        value: USDT
      - key: PAPER_INITIAL_BALANCE_AMOUNT
        value: "10000"
      - key: API_KEY_REQUIRED_FOR_ALL
        value: "true"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: REDIS_URL
        value: ""
      - key: MONGO_URI
        sync: false
      - key: CONTROL_API_KEY
        sync: false
